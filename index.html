<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Je t'aime ❤️</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    height: 100%;
    overflow: hidden;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: black;
  }
</style>
</head>
<body>
<canvas id="coeur"></canvas>

<script>
const canvas = document.getElementById("coeur");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);


function toScreen(x, y) {
  return {
    sx: canvas.width / 2 + x,
    sy: canvas.height / 2 - y  
  };
}

ctx.fillStyle = "#bd0d28";
ctx.font = "bold 8px Calibri, sans-serif";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

 
const points = [];
for (let scale = 11; scale < 17; scale++) {
  for (let i = 0; i < 120; i++) {
    const angle = i * (Math.PI * 2) / 120;
    const x = 16 * Math.pow(Math.sin(angle), 3) * scale;
    const y = (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale;
    points.push({ x, y });
  }
}

let index = 0;
const pointsPerFrame = 2;  

function draw() {
  if (index < points.length) {
    for (let k = 0; k < pointsPerFrame && index < points.length; k++, index++) {
      const p = points[index];
      const { sx, sy } = toScreen(p.x, p.y);
      ctx.fillText("Je t'aime", sx, sy);
    }
    requestAnimationFrame(draw);
  }
}

draw();
</script>
</body>
</html>
